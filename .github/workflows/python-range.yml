# Tests the same deterministic check set as the `lint` job in `ci.yml`, against
# Python 3.14 instead of the 3.13 floor.
#
# The two step lists are deliberately kept as separate, flat definitions rather
# than shared through a reusable workflow. A reusable workflow is reported by
# GitHub as `<caller job> / <called job>` — `lint / checks` — and `main`'s
# branch protection requires the status context `lint` by that exact literal
# name. Routing `lint` through `workflow_call` therefore leaves the required
# context permanently unsatisfied and makes `main` unmergeable. The
# branch-protection requirement stands on its own. Measured, not assumed: that
# design reported `lint / checks` and left the pull request `BLOCKED` with every
# check green.
#
# Cost of the duplication is one step list to keep in step. Changing a check
# means editing both files; a header comment in each points at the other.

name: python-range

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # GitHub can delay or drop scheduled workflows at the start of an hour.
    - cron: "17 9 * * 1"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.11.7"
  SKILLS_REF_SPEC: "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

jobs:
  python-range:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Python script lint
        run: uv run --locked ruff check scripts/ skills/
      - name: Shell script lint
        run: shellcheck scripts/*.sh .githooks/*
      - name: Check Python workflow parity
        run: python3 scripts/check-python-range-parity.py
      - name: Check cross-agent portability
        run: python3 scripts/check-portability.py
      - name: Enforce skills-ref evidence policy
        run: python3 scripts/check-skills-ref-policy.py .
      - name: Validate Agent Skills format
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=3
          RETRY_BACKOFF_SECONDS=1
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            if uvx --from "${SKILLS_REF_SPEC}" skills-ref validate skills/repo-health-scan; then
              exit 0
            fi
            if [[ "${attempt}" == "${MAX_ATTEMPTS}" ]]; then
              echo "skills-ref validation failed after ${MAX_ATTEMPTS} attempts" >&2
              exit 1
            fi
            sleep $((RETRY_BACKOFF_SECONDS * (2 ** (attempt - 1))))
          done
          exit 1
      - name: Self-test — doc audit
        run: python3 scripts/doc-audit.py --self-test
      - name: Self-test — verify.sh
        run: bash scripts/verify.sh --self-test
      - name: Self-test — URL verifier
        run: python3 scripts/verify-urls.py --self-test
      - name: Self-test — test extractor
        run: python3 scripts/extract-tests.py --self-test
      - name: Self-test — script validator
        run: python3 scripts/validate-scripts.py --self-test
      - name: Self-test — eval validator
        run: python3 scripts/validate-evals.py --self-test
      - name: Self-test — security and trust validator
        run: python3 scripts/check-trust.py --self-test
      - name: Self-test — workflow parity checker
        run: python3 scripts/check-python-range-parity.py --self-test
      - name: Validate behavioral eval contract
        run: python3 scripts/validate-evals.py
      - name: Validate security and trust contract
        run: python3 scripts/check-trust.py
