name: ci

env:
  PYTHON_VERSION: "3.13"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'docs/**'
      - 'evals/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'repo-health-skill-roadmap.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'CITATION.cff'
      - '.gitignore'
      - '.repo-health.json'
      - '.codex-plugin/plugin.json'
      - '.github/workflows/**'
      - '.github/*.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'docs/**'
      - 'evals/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'repo-health-skill-roadmap.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'CITATION.cff'
      - '.gitignore'
      - '.repo-health.json'
      - '.codex-plugin/plugin.json'
      - '.github/workflows/**'
      - '.github/*.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install dependencies
        run: uv sync
      - name: Check cross-agent portability
        run: python3 scripts/check-portability.py
      - name: Self-test — doc audit
        run: python3 scripts/doc-audit.py --self-test
      - name: Self-test — verify.sh
        run: bash scripts/verify.sh --self-test
      - name: Self-test — expiry checker
        run: python3 scripts/check-expiry.py --self-test
      - name: Self-test — URL verifier
        run: python3 scripts/verify-urls.py --self-test
      - name: Self-test — test extractor
        run: python3 scripts/extract-tests.py --self-test
      - name: Self-test — script validator
        run: python3 scripts/validate-scripts.py --self-test
      - name: Self-test — eval validator
        run: python3 scripts/validate-evals.py --self-test
      - name: Self-test — security and trust validator
        run: python3 scripts/check-trust.py --self-test
      - name: Self-test — version consistency
        run: python3 scripts/check-version-consistency.py --self-test
      - name: Validate behavioral eval contract
        run: python3 scripts/validate-evals.py
      - name: Validate security and trust contract
        run: python3 scripts/check-trust.py
      - name: Shell script lint
        run: shellcheck scripts/*.sh
      - name: Python script lint
        run: uv run ruff check scripts/ skills/
      - name: Version consistency check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-version-consistency.py --require-github-release-query

  full-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Full verification
        run: bash scripts/verify.sh

  phase-b-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      COMMIT_RANGE: ${{ github.event.before == '0000000000000000000000000000000000000000' && 'origin/main..HEAD' || format('{0}..{1}', github.event.before, github.event.after) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Phase B — Pre-release health check
        run: |
          echo "=== Phase B: Pre-release health check ==="
          echo "Checking commit range: ${COMMIT_RANGE}"
          if ! git diff --name-only "${COMMIT_RANGE}" >/dev/null; then
            echo "BLOCKING: commit range is invalid or unavailable"
            exit 1
          fi
          if [ -n "$(git diff --name-only "${COMMIT_RANGE}")" ]; then
            echo "PASS: commit range resolves to a non-empty change set"
          else
            echo "BLOCKING: commit range is empty or unavailable"
            exit 1
          fi
          if ! git diff --check "${COMMIT_RANGE}"; then
            echo "BLOCKING: commit range contains whitespace errors"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "BLOCKING: dirty tree"
            exit 1
          fi
          echo "PASS: commit range and tree are clean"

  check-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check for expired references
        run: python3 scripts/check-expiry.py --strict

  verify-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify referenced URLs
        run: python3 scripts/verify-urls.py
