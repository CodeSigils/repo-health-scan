name: ci

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11.7"
  SKILLS_REF_SPEC: "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # GitHub can delay or drop scheduled workflows at the start of an hour.
    - cron: "17 9 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # `pyproject.toml` declares `requires-python = ">=3.13"`, so this job is
  # pinned to the 3.13 floor and `.github/workflows/python-range.yml` runs the
  # same checks against 3.14. The two step lists are separate on purpose: a
  # reusable workflow is reported as `lint / checks`, and branch protection
  # requires the literal context `lint`. Changing a check means editing both
  # files.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Python script lint
        run: uv run --locked ruff check scripts/ skills/
      - name: Shell script lint
        run: shellcheck scripts/*.sh .githooks/*
      - name: Check Python workflow parity
        run: python3 scripts/check-python-range-parity.py
      - name: Check cross-agent portability
        run: python3 scripts/check-portability.py
      - name: Enforce skills-ref evidence policy
        run: python3 scripts/check-skills-ref-policy.py .
      - name: Validate Agent Skills format
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=3
          RETRY_BACKOFF_SECONDS=1
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            if uvx --from "${SKILLS_REF_SPEC}" skills-ref validate skills/repo-health-scan; then
              exit 0
            fi
            if [[ "${attempt}" == "${MAX_ATTEMPTS}" ]]; then
              echo "skills-ref validation failed after ${MAX_ATTEMPTS} attempts" >&2
              exit 1
            fi
            sleep $((RETRY_BACKOFF_SECONDS * (2 ** (attempt - 1))))
          done
          exit 1
      - name: Self-test — doc audit
        run: python3 scripts/doc-audit.py --self-test
      - name: Self-test — verify.sh
        run: bash scripts/verify.sh --self-test
      - name: Self-test — URL verifier
        run: python3 scripts/verify-urls.py --self-test
      - name: Self-test — test extractor
        run: python3 scripts/extract-tests.py --self-test
      - name: Self-test — script validator
        run: python3 scripts/validate-scripts.py --self-test
      - name: Self-test — eval validator
        run: python3 scripts/validate-evals.py --self-test
      - name: Self-test — security and trust validator
        run: python3 scripts/check-trust.py --self-test
      - name: Self-test — workflow parity checker
        run: python3 scripts/check-python-range-parity.py --self-test
      - name: Validate behavioral eval contract
        run: python3 scripts/validate-evals.py
      - name: Validate security and trust contract
        run: python3 scripts/check-trust.py

  full-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Full verification
        run: bash scripts/verify.sh --after-lint

  phase-b-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: lint
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || (github.event.before == '0000000000000000000000000000000000000000' && 'origin/main..HEAD' || format('{0}..{1}', github.event.before, github.event.after)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Commit range and tree check
        run: |
          echo "=== Commit range and tree check ==="
          echo "Checking commit range: ${COMMIT_RANGE}"
          if ! git diff --name-only "${COMMIT_RANGE}" >/dev/null; then
            echo "BLOCKING: commit range is invalid or unavailable"
            exit 1
          fi
          if [ -n "$(git diff --name-only "${COMMIT_RANGE}")" ]; then
            echo "PASS: commit range resolves to a non-empty change set"
          else
            echo "BLOCKING: commit range is empty or unavailable"
            exit 1
          fi
          if ! git diff --check "${COMMIT_RANGE}"; then
            echo "BLOCKING: commit range contains whitespace errors"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "BLOCKING: dirty tree"
            exit 1
          fi
          echo "PASS: commit range and tree are clean"
      - name: Commit subject convention check
        run: |
          echo "=== Commit subject convention check ==="
          echo "Generated merge commits are excluded; authored commits remain subject to the convention."
          python3 scripts/check-commit-convention.py --range "${COMMIT_RANGE}"

  verify-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify referenced URLs
        run: python3 scripts/verify-urls.py --attempts 3 --retry-delay 2

  # A dependency pull request can sit mergeable for weeks without any check
  # going red, and the configured open-pull-requests limit then silently
  # blocks the next update. A red check emails the owner, so the backlog is
  # made to fail the scheduled run once it is stale; the comment is written for
  # whoever reviews the pull request, the non-zero exit is for the owner.
  dependency-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Comment on and fail on stale dependency pull requests
        run: python3 scripts/check-dependency-backlog.py --post
