name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag is on main
        env:
          TAG_COMMIT: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "The release tag must point to a commit reachable from origin/main."
            exit 1
          fi
      - name: Verify the tagged commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ github.sha }}
        run: |
          successful_runs=$(gh run list --workflow ci.yml --commit "${TAG_COMMIT}" \
            --status completed --json conclusion \
            --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "${successful_runs}" -lt 1 ]; then
            echo "No successful ci.yml run was found for ${TAG_COMMIT}."
            exit 1
          fi
          echo "Found ${successful_runs} successful CI run(s) for ${TAG_COMMIT}."
      - name: Check tagged diff
        run: git diff --check "${{ github.sha }}^" "${{ github.sha }}"

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
