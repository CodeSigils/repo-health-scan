name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag is on main
        env:
          TAG_COMMIT: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "The release tag must point to a commit reachable from origin/main."
            exit 1
          fi
      - name: Verify the tagged commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ github.sha }}
        run: |
          successful_run_ids=$(gh run list --workflow ci.yml --commit "${TAG_COMMIT}" \
            --status completed --json conclusion,databaseId \
            --jq '.[] | select(.conclusion == "success") | .databaseId')
          verified=0
          while IFS= read -r run_id; do
            [ -n "${run_id}" ] || continue
            if gh run view "${run_id}" --json jobs --jq '([.jobs[] | select(.name == "lint" or .name == "full-verify") | .conclusion] | (length == 2 and all(.[]; . == "success")))' | grep -qx true; then
              verified=1
              echo "Verified ci.yml run ${run_id} with lint and full-verify success."
              break
            fi
          done <<< "${successful_run_ids}"
          if [ "${verified}" -ne 1 ]; then
            echo "No successful ci.yml run with required jobs was found for ${TAG_COMMIT}."
            exit 1
          fi
      - name: Check tagged diff
        run: git diff --check "${{ github.sha }}^" "${{ github.sha }}"

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if release_json=$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease 2>/dev/null); then
            if [ "$(printf '%s' "$release_json" | jq -r '.isDraft')" = "false" ]; then
              echo "GitHub Release $GITHUB_REF_NAME already exists; treating rerun as successful."
              exit 0
            fi
            echo "A draft GitHub Release already exists for $GITHUB_REF_NAME; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
